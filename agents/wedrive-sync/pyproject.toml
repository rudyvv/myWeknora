[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "weknora-wedrive-sync-agent"
version = "0.4.2"
description = "Windows headed RPA inventory agent for WeKnora WeCom WeDrive sync"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=46.0.0",
  "httpx>=0.28.0",
  "playwright>=1.55.0",
  "websockets>=15.0.0",
]

[project.scripts]
weknora-wedrive-agent = "weknora_wedrive_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weknora_wedrive_agent"]
